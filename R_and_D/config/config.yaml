# R&D Data Pipeline Configuration

storage:
  base_path: "R_and_D/data"
  partition_by: ["market_id", "date"]
  format: "parquet"

polymarket:
  clob_api_url: "https://clob.polymarket.com"
  gamma_api_url: "https://gamma-api.polymarket.com"

analysis:
  rolling_windows: [60, 300, 900]
  z_score_threshold: 2.0
  velocity_window: 5

strategy:
  entry_z_threshold: 2.0
  tp_multiplier: 1.5
  sl_multiplier: 0.6
  fee_pct: 0.02
